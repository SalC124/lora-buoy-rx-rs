<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ESP-RS JSON Post Handler</title>
    <style type="text/css">
      body {
        max-width: 50em;
        margin: auto;
        padding: 1em;
        font: 1em/1.65 sans-serif;
      }
      input {
        width: 100%;
        height: 3em;
        margin-bottom: 1em;
      }
    </style>
  </head>
  <body>
    <div id="lora-data"></div>
    <script type="text/javascript">
      async function updateData() {
        let resp = await fetch("/data");
        let data = await resp.json();
        document.getElementById("lora-data").innerText = JSON.stringify(data);
      }

      setInterval(updateData, 1000);
      updateData();
    </script>
  </body>
</html>
